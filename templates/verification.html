<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verification</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            background: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .verify-container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .verify-container h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .verify-container p {
            font-size: 14px;
            color: #555;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            color: #fff;
            background: #3498db;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

<div class="verify-container">
    <h2>Verify Your Account</h2>
    <p>Click the button below to verify your account and continue shopping.</p>
    
    <form action="/verification" method="GET">
        <button type="submit">Verify Account</button>
    </form>
</div>

</body>
</html>
